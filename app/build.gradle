plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pcstream.viewer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.pcstream.viewer'
        minSdk 29            // Android 10+
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// no dependencies on purpose: the app is just the system WebView pointed at your server
